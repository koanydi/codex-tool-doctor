name: Cross-platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node src/cli.mjs --help
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error
      - name: Bootstrap without system Node or project dependencies
        if: matrix.node == 24
        run: node scripts/check-bootstrap.mjs
